<header>
<h1>Xmex 在线编译器</h1>
<span class="sub">基于 LLVM 的 Python 系语言编译器 · 支持代码补全与内置函数速查</span>
</header>
<div class="toolbar">
<label style="font-size:13px;color:#8b949e">示例代码：</label>
<select id="examples"></select>

<div class="main">
<div class="pane">
<div class="label">代码编辑（输入时自动补全：关键字 / 内置函数 / 模块成员；Tab 缩进）</div>
<div class="editor-wrap">
<textarea id="editor" spellcheck="false"></textarea>
<div id="suggest"></div>
</div>
</div>
<div class="divider"></div>
<div class="pane">
<div class="label">运行输出</div>
<div id="output">点击『运行』执行左侧代码...</div>
</div>
</div>

const editor = document.getElementById("editor");
const output = document.getElementById("output");
const statusEl = document.getElementById("status");
const sel = document.getElementById("examples");
const runBtn = document.getElementById("runBtn");
const clearBtn = document.getElementById("clearBtn");
const docBtn = document.getElementById("docBtn");
const docPanel = document.getElementById("docPanel");
const docClose = document.getElementById("docClose");
const docBody = document.getElementById("docBody");
const suggest = document.getElementById("suggest");

for (const [key, ex] of Object.entries(EXAMPLES)) {
  const opt = document.createElement("option");
  opt.value = key;
  opt.textContent = ex.name;
  sel.appendChild(opt);
}
function loadExample() { editor.value = EXAMPLES[sel.value].code; }
sel.addEventListener("change", loadExample);
loadExample();

let sugItems = [];
let sugIndex = -1;
let sugStart = 0;

function currentToken() {
  const pos = editor.selectionStart;
  const text = editor.value.slice(0, pos);
  const m = text.match(/([A-Za-z_][A-Za-z0-9_]*)(\.[A-Za-z0-9_]*)?$/);
  if (!m) return null;
  return { word: m[1], dot: m[2] || null, start: pos - m[0].length };
}

function buildItems() {
  const t = currentToken();
  if (!t) return null;
  let items = [];
  if (t.dot !== null) {
    const mod = MODULES[t.word];
    if (!mod) return null;
    const frag = t.dot.slice(1).toLowerCase();
    for (const [sig, desc] of mod.fns) {
      const name = sig.split("(")[0];
      if (!frag || name.toLowerCase().startsWith(frag)) items.push({ label: t.word + "." + sig, insert: name, kind: "模块函数", sig: desc });
    }
  } else {
    const frag = t.word.toLowerCase();
    if (!frag) return null;
    for (const kw of KEYWORDS) if (kw.toLowerCase().startsWith(frag)) items.push({ label: kw, insert: kw, kind: "关键字", sig: "" });
    for (const [sig, desc] of BUILTINS) {
      const name = sig.split("(")[0];
      if (name.toLowerCase().startsWith(frag)) items.push({ label: sig, insert: name, kind: "内置函数", sig: desc });
    }
    for (const mname of Object.keys(MODULES)) if (mname.toLowerCase().startsWith(frag)) items.push({ label: mname, insert: mname, kind: "模块", sig: MODULES[mname].desc });
    for (const m of STR_METHODS) if (m.startsWith(frag)) items.push({ label: m + "()", insert: m, kind: "字符串方法", sig: "" });
    for (const m of LIST_METHODS) if (m.startsWith(frag)) items.push({ label: m + "()", insert: m, kind: "列表方法", sig: "" });
  }
  if (!items.length) return null;
  return { items: items.slice(0, 12), start: t.start, token: t };
}

function hideSuggest() { suggest.style.display = "none"; sugItems = []; sugIndex = -1; }

function renderSuggest(data) {
  sugItems = data.items;
  sugStart = data.start;
  sugIndex = 0;
  suggest.innerHTML = "";
  data.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === 0 ? " sel" : "");
    d.innerHTML = "<span>" + it.label + "</span>" + (it.sig ? "<span class=\"sig\">" + it.sig + "</span>" : "") + "<span class=\"kind\">" + it.kind + "</span>";
    d.addEventListener("mousedown", (e) => { e.preventDefault(); applySuggest(i); });
    suggest.appendChild(d);
  });
  const pos = editor.selectionStart;
  const before = editor.value.slice(0, pos);
  const lines = before.split("\n");
  const row = lines.length - 1;
  const col = lines[lines.length - 1].length;
  const lineH = 22.4;
  const charW = 8.4;
  suggest.style.left = Math.min(28 + col * charW, editor.clientWidth - 240) + "px";
  suggest.style.top = Math.min(14 + (row + 1) * lineH - editor.scrollTop, editor.clientHeight - 60) + "px";
  suggest.style.display = "block";
}

function applySuggest(i) {
  if (i < 0 || i >= sugItems.length) return;
  const t = currentToken();
  if (!t) { hideSuggest(); return; }
  const it = sugItems[i];
  const pos = editor.selectionStart;
  let replaceFrom = t.start;
  if (t.dot !== null) replaceFrom = pos - t.dot.slice(1).length;
  editor.value = editor.value.slice(0, replaceFrom) + it.insert + editor.value.slice(pos);
  editor.selectionStart = editor.selectionEnd = replaceFrom + it.insert.length;
  hideSuggest();
  editor.focus();
}

editor.addEventListener("input", () => {
  const data = buildItems();
  if (data) renderSuggest(data); else hideSuggest();
});
editor.addEventListener("keydown", (e) => {
  if (suggest.style.display === "block") {
    if (e.key === "ArrowDown") { e.preventDefault(); sugIndex = Math.min(sugIndex + 1, sugItems.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sugIndex = Math.max(sugIndex - 1, 0); }
    else if (e.key === "Enter" || e.key === "Tab") { if (sugIndex >= 0) { e.preventDefault(); applySuggest(sugIndex); return; } }
    else if (e.key === "Escape") { hideSuggest(); return; }
    const nodes = suggest.querySelectorAll(".item");
    nodes.forEach((n, i) => n.classList.toggle("sel", i === sugIndex));
    if (e.key === "Enter" || e.key === "Tab") return;
  }
  if (e.key === "Tab" && suggest.style.display !== "block") {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + "    " + editor.value.slice(s);
    editor.selectionStart = editor.selectionEnd = s + 4;
  }
});
editor.addEventListener("blur", () => setTimeout(hideSuggest, 150));
editor.addEventListener("scroll", hideSuggest);

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderDoc() {
  let h = "";
  h += "<div class=\"doc-note\">以下清单来自编译器的真实定义，补全提示与此一致。模块函数以 <b>模块.函数(...)</b> 形式调用；容器方法（如 <b>x.append(v)</b>）运行时按类型分派。</div>";
  h += "<div class=\"doc-sec\"><h3>全局内置函数</h3>";
  for (const [sig, desc] of BUILTINS) h += "<div class=\"doc-fn\">" + esc(sig) + " <span class=\"fndesc\">—— " + esc(desc) + "</span></div>";
  h += "<div class=\"doc-fn\">x." + STR_METHODS.join(" / x.") + " <span class=\"fndesc\">—— 字符串方法</span></div>";
  h += "<div class=\"doc-fn\">lst." + LIST_METHODS.join(" / lst.") + " <span class=\"fndesc\">—— 列表方法</span></div>";
  h += "</div>";
  for (const [mname, mod] of Object.entries(MODULES)) {
    h += "<div class=\"doc-mod\"><h3>" + esc(mname) + " <span style=\"color:#8b949e;font-size:12px\">—— " + esc(mod.desc) + "</span></h3>";
    for (const [sig, desc] of mod.fns) h += "<div class=\"doc-fn\">" + esc(mname + "." + sig) + " <span class=\"fndesc\">—— " + esc(desc) + "</span></div>";
    h += "</div>";
  }
  docBody.innerHTML = h;
}
renderDoc();

docBtn.addEventListener("click", () => docPanel.classList.toggle("open"));
docClose.addEventListener("click", () => docPanel.classList.remove("open"));

runBtn.addEventListener("click", async () => {
  runBtn.disabled = true;
  statusEl.textContent = "编译运行中...";
  output.innerHTML = "<span style='color:#8b949e'>正在提交到服务端编译执行，请稍候...</span>";
  try {
    const resp = await fetch("/xmex_run/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: editor.value })
    });
    const r = await resp.json();
    let html = "";
    if (r.stage && r.stage !== "run") html += "<span style='color:#f85149'>[" + esc(r.stage) + " 阶段]</span>\n";
    html += esc(r.output || "（无输出）");
    if (r.elapsed_ms !== undefined) html += "\n<span style='color:#8b949e'>--- 耗时 " + r.elapsed_ms + " ms，退出码 " + r.exit_code + " ---</span>";
    output.innerHTML = html;
    statusEl.textContent = r.ok ? "运行成功" : "执行完成（有错误）";
  } catch (e) {
    output.innerHTML = "<span style='color:#f85149'>请求失败: " + esc(String(e)) + "</span>";
    statusEl.textContent = "请求失败";
  }
  runBtn.disabled = false;
});
clearBtn.addEventListener("click", () => { output.innerHTML = "<span style='color:#8b949e'>输出已清空</span>"; statusEl.textContent = "就绪"; });
</script>
